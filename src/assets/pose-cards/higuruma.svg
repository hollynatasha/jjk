<text x="40" y="666" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">Hands: two · View: front camera (mirrored)</text>
<text x="40" y="688" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">Wrist gap: About one palm length.</text>
<text x="40" y="710" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">Keep visible: All ten fingertips.</text>
<text x="40" y="732" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">1. Raise your right hand, palm to the camera, fingers together.</text>
<text x="40" y="754" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">2. Hold your left hand flat, palm down, just below and beside it.</text>
<text x="40" y="776" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">3. Point the flat hand’s fingers toward the upright palm.</text>
<text x="40" y="798" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">4. Keep about a palm length between the wrists.</text>
<text x="40" y="826" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#17130f" opacity="0.7">Official reference: https://jujutsukaisen.jp/episodes/56.php</text>
