<text x="40" y="666" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">Hands: two · View: front camera (mirrored)</text>
<text x="40" y="688" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">Wrist gap: About one finger width (2 cm).</text>
<text x="40" y="710" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">Keep visible: Both wrists and the raised middle and ring fingertips.</text>
<text x="40" y="732" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">1. Bring both hands together in front of your chest.</text>
<text x="40" y="754" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">2. Fold your index and pinky fingers down.</text>
<text x="40" y="776" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">3. Raise middle and ring fingers so their tips meet in a peak.</text>
<text x="40" y="798" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">4. Open a small gap between your palms and tilt them toward the camera.</text>
<text x="40" y="826" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#17130f" opacity="0.7">Official reference: https://jujutsukaisen.jp/episodes/41.php</text>
