<g transform="translate(334,120) rotate(-6)"><rect width="230" height="34" fill="none" stroke="#c2412b" stroke-width="2"/><text x="115" y="23" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#c2412b">CAMERA-FRIENDLY APPROXIMATION</text></g>
<text x="40" y="666" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">Hands: two · View: front camera (mirrored)</text>
<text x="40" y="688" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">Wrist gap: About 5 cm.</text>
<text x="40" y="710" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">Keep visible: Both thumbs, both wrists and the knuckle ridge.</text>
<text x="40" y="732" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">1. Face your palms toward each other, a hand-width apart.</text>
<text x="40" y="754" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">2. Interlace just the fingertips, alternating left and right.</text>
<text x="40" y="776" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">3. Bend the middle knuckles so the hands form a peak.</text>
<text x="40" y="798" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">4. Point both thumbs up, side by side.</text>
<text x="40" y="826" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#17130f" opacity="0.7">Official reference: https://jujutsukaisen.jp/episodes/23.php</text>
