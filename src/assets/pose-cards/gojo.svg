<text x="40" y="666" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">Hands: one · View: front camera (mirrored)</text>
<text x="40" y="688" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">Wrist gap: One hand, so no wrist gap. Keep the other hand out of frame.</text>
<text x="40" y="710" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">Keep visible: Index and middle fingertips, plus the wrist.</text>
<text x="40" y="732" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">1. Raise your right hand to chin height, palm toward the camera.</text>
<text x="40" y="754" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">2. Point your index finger up.</text>
<text x="40" y="776" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">3. Hook your middle finger over it, tips a few millimetres apart.</text>
<text x="40" y="798" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="14" fill="#17130f">4. Fold ring and pinky under your thumb.</text>
<text x="40" y="826" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#17130f" opacity="0.7">Official reference: https://jujutsukaisen.jp/episodes/07.php</text>
</svg>
